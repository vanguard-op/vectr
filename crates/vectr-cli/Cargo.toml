[package]
name = "vectr-cli"
description = "Vectr command-line interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "vectr"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# The engine the CLI drives: parse, validate, compile and export (C-002).
vectr-core = { path = "../vectr-core" }

# Structured output for `validate --json` (C-004).
serde_json = { workspace = true }
