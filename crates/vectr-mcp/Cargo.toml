[package]
name = "vectr-mcp"
description = "Vectr MCP server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# Published to crates.io as the MCP server (D-006, C-005). Published after the
# library crates it depends on.
keywords = ["mcp", "svg", "vector-graphics", "ai"]
categories = ["command-line-utilities", "graphics"]

[[bin]]
name = "vectr-mcp"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# The engine the server drives: parse, validate, compile, export and the schema
# contract (C-002). The explicit version keeps the path dependency from
# registering as a `*` wildcard in the dependency graph (NFR-020); it must track
# vectr-core's package version in the workspace manifest.
vectr-core = { version = "0.1.0", path = "../vectr-core" }

# Loading a scene's project assets, shared with the command line so both front
# ends resolve a project identically: the same documents read in the same order,
# with the same diagnostics (FEAT-016, FEAT-019).
vectr-project = { version = "0.1.0", path = "../vectr-project" }

# The MCP wire format is JSON-RPC 2.0; messages and the tool schemas are built
# as JSON values (C-005).
serde_json = { workspace = true }
