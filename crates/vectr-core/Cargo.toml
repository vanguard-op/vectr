[package]
name = "vectr-core"
description = "Vectr scene engine: parse, validate, resolve, style, compile, and export."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# Published to crates.io as the embeddable library (D-006). The package carries
# its own copy of the published JSON Schema so it builds standalone; the release
# workflow publishes it before the crates that depend on it.
keywords = ["svg", "vector-graphics", "graphics", "renderer"]
categories = ["graphics", "rendering", "multimedia::images"]

[lints]
workspace = true

[dependencies]
# The scene document model and its strict JSON serialization (C-001).
serde = { workspace = true }
serde_json = { workspace = true }

# Boolean composition of filled regions for the composition primitives
# (D-007, FEAT-003).
i_overlay = { workspace = true }

# Text shaping and font parsing for the Font & Asset Manager (D-004, D-019,
# FEAT-024). The workspace pins both versions; text is shaped with harfrust
# and glyph outlines are read with skrifa, so shaping and outlining share one
# font parser (read-fonts) and the unmaintained rustybuzz/ttf-parser stack
# stays out of the tree (NFR-020).
harfrust = { workspace = true }
skrifa = { workspace = true }

# The rasterizer behind PNG export (D-007, FEAT-013). It is optional so a build
# without it still validates, compiles and exports SVG, and reports PNG's
# missing capability rather than failing silently (NFR-004).
#
# Inherited from the workspace entry so the rasterizer version is declared once
# (NFR-020). Cargo takes `default-features` from the workspace dependency, not
# the member, and the workspace `resvg` entry carries `default-features = false`
# (D-007), so its native system-font, text, SVGZ and raster-image defaults stay
# off and the rasterizer remains pure-Rust and free of native system
# dependencies.
resvg = { workspace = true, optional = true }

[features]
default = ["rasterizer"]
# PNG export (FEAT-013); disabling it makes `export_png` report the missing
# rasterizer.
rasterizer = ["dep:resvg"]
