# cargo-deny configuration: dependency, advisory and license gate.
#
# Enforces NFR-020 (supply chain: advisories, pinned wildcard-free versions,
# trusted sources) and NFR-041 (third-party license compliance). Run by CI
# (.github/workflows/ci.yml) and against the release dependency graph.

[graph]
# Whole-workspace graph; no target pruning.
targets = []

[advisories]
# Use the RustSec advisory database. Any unignored vulnerability fails the
# build; ignore entries must carry a reason.
ignore = []

[licenses]
confidence-threshold = 0.9
# The allow-list is deliberately a superset of what the graph currently needs
# (fonts and future dependencies), so an allowance with no match is expected and
# is not a warning.
unused-allowed-license = "allow"
# Permissive and notice-only licenses compatible with distribution.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "0BSD",
    "OFL-1.1",
]
exceptions = []

[licenses.private]
# Enforce the workspace crates' declared licence (NFR-041). Every product crate
# now carries `license = "MIT OR Apache-2.0"` (D-010) and is published to
# crates.io (D-006); vectr-eval is maintainer-only but carries the same SPDX
# licence. With `ignore = false` cargo-deny checks each workspace crate's
# declared licence against `allow`, so a crate that ships without a compatible
# SPDX licence fails the gate instead of slipping through as a private
# placeholder.
ignore = false

[bans]
multiple-versions = "warn"
# NFR-020: no `*` version requirements anywhere in the graph.
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
