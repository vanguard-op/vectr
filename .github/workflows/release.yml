name: Release

# Builds, checksums and signs the distributable artifacts, publishes the
# product crates to crates.io, and opens the GitHub Release. Vectr is
# distributed rather than hosted, so there is no service to deploy (release.md,
# "Environments & Promotion").
#
# Promotion rule: a release is built from the exact revision that passed
# continuous integration. The `verify` job refuses to proceed unless the tagged
# revision has a successful CI run, and every job below needs it. The version
# tag is the release owner's approval.
#
# Release integrity (NFR-025): the release is signed and its checksums are
# published. GitHub artifact attestations are only available for public
# repositories or GitHub Enterprise Cloud organizations, and this repository is
# private on a Free plan, so the release is signed with a maintainer GPG key
# instead. `scripts/sign-release.sh` signs the combined SHA256SUMS and exports
# the matching public key; both are attached to the release, and the same
# command runs locally.
#
# Required repository secrets:
#   CARGO_REGISTRY_TOKEN — a crates.io API token with publish scope for the
#     vectr-* crates (D-006).
#   GPG_PRIVATE_KEY — the ASCII-armored private key that signs the release
#     (NFR-025). Never committed (NFR-026).
#   GPG_PASSPHRASE — that key's passphrase, when it has one.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: verify the tagged revision passed CI
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Require a successful CI run on the tagged revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=completed" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          echo "successful CI runs for ${GITHUB_SHA}: ${runs}"
          if [ "${runs}" -eq 0 ]; then
            echo "::error::no successful CI run for ${GITHUB_SHA}; refusing to release"
            exit 1
          fi

  build:
    name: build (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Package binaries and checksums (NFR-025)
        shell: bash
        run: scripts/package.sh "${{ matrix.target }}" dist

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  skill:
    name: package the agent skill (FEAT-020)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package the skill archive and checksum (NFR-025)
        run: scripts/package-skill.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: skill
          path: dist/*
          if-no-files-found: error

  sbom:
    name: sbom (NFR-020)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The action writes the SBOM to an existing directory; nothing else in
      # this job creates it, so a missing `dist/` fails the release here.
      - name: Prepare the dist directory
        run: mkdir -p dist
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: dist/vectr-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/vectr-sbom.cdx.json
          if-no-files-found: error

  crates:
    name: publish crates.io (D-006)
    needs: [verify, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          key: publish

      - name: Publish the product crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish-crates.sh

  release:
    name: publish release
    needs: [verify, build, skill, sbom]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Combined checksums (NFR-025)
        shell: bash
        run: |
          cd dist
          sha256sum $(find . -maxdepth 1 -type f -name 'vectr-*' \
            ! -name '*.sha256' ! -name '*.json' -printf '%f\n' | sort) > SHA256SUMS
          cat SHA256SUMS

      - name: Sign the release checksums (NFR-025)
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: scripts/sign-release.sh dist/SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
