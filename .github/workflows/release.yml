name: Release

# Builds, checksums and attests the distributable binaries. The workflow is
# the release path for the GitHub Release channel; it does not deploy a
# service, because Vectr is distributed rather than hosted.
#
# Distribution also includes crates.io (D-006). Publishing is deliberately not
# automated here: the crates carry no SPDX license yet and are marked
# `publish = false` until the project license is settled, and publishing is
# gated by the release owner. Once that is resolved, publish with:
#
#   cargo publish -p vectr-core --locked
#   cargo publish -p vectr-cli  --locked
#
# using a CARGO_REGISTRY_TOKEN secret.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Package binary and checksum (NFR-025)
        shell: bash
        run: scripts/package.sh "${{ matrix.target }}" vectr dist

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  sbom:
    name: sbom (NFR-020)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: dist/vectr-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/vectr-sbom.cdx.json
          if-no-files-found: error

  release:
    name: publish release
    needs: [build, sbom]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Combined checksums (NFR-025)
        shell: bash
        run: |
          cd dist
          sha256sum $(find . -maxdepth 1 -type f -name 'vectr-*' \
            ! -name '*.sha256' ! -name '*.json' -printf '%f\n' | sort) > SHA256SUMS
          cat SHA256SUMS

      - name: Attest release bundle
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
