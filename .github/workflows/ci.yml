name: CI

# Every change is gated by the same commands that run locally
# (scripts/check.sh), so a failure is reproducible with one command. The
# canonical gate covers the tests, the determinism check, and the dependency,
# advisory and license scans (release.md, "Environments & Promotion").
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Determinism and the toolchain are verified on every supported OS
        # (NFR-010).
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup component add rustfmt clippy

      # The canonical gate runs scripts/deny.sh, so cargo-deny is installed on
      # each runner and the gate is identical on every supported OS. The scan
      # itself is target-agnostic (deny.toml sets `[graph] targets = []`), so it
      # runs inside the gate rather than as a second, separate job (NFR-020,
      # NFR-041).
      - name: Install pinned cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - uses: Swatinem/rust-cache@v2

      - name: Format, lint, build, test, determinism and scans
        shell: bash
        run: scripts/check.sh
