name: CI

# Every change is gated by the same commands that run locally
# (scripts/check.sh), plus the dependency and license scan.
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Determinism and the toolchain are verified on every supported OS
        # (NFR-010).
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format, lint, build, test
        shell: bash
        run: scripts/check.sh

  deny:
    name: dependency & license scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cargo-deny: advisories (NFR-020) and license inventory (NFR-041).
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ./Cargo.toml
