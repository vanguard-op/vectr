name: CI

# Every change is gated by the same commands that run locally
# (scripts/check.sh), plus the dependency and license scan.
on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Determinism and the toolchain are verified on every supported OS
        # (NFR-010).
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format, lint, build, test
        shell: bash
        run: scripts/check.sh

  deny:
    name: dependency & license scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Install the pinned cargo-deny and run the same local script a developer
      # runs, so the scan is reproducible outside CI and its output is not
      # hidden inside an action (NFR-020 advisories, NFR-041 licences).
      - name: Install pinned cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - name: Dependency, advisory and license scan
        run: scripts/deny.sh
